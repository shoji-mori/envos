[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envos"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy>=1.6",
    "pandas",
    "matplotlib",
    "astropy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
extra = ["joblib", "psutil"]

[tool.setuptools]
packages = ["envos", "envos.plot_tools"]

[tool.setuptools.package-data]
envos = ["storage/*"]

[tool.setuptools.dynamic]
version = {attr = "envos.__version__"}

[tool.pytest.ini_options]
# Make the repo root importable regardless of how pytest is invoked
# (CI runs `pytest` directly; tests import `tests.golden_helpers`).
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "radmc: requires radmc3d binary and real radmc3dPy",
]
testpaths = ["tests"]
